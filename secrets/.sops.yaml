# SOPS configuration for k3s-remotelab
# This file contains the public key for age encryption
# The private key should be stored in secrets/keys/local.key (gitignored)

creation_rules:
  # Encrypt all *-secrets.yaml.enc files with age
  - path_regex: .*-secrets\.yaml\.enc$
    age: >-
      age1remotelab0000000000000000000000000000000000000000000000000000
    # Note: Replace the age public key above with your generated key
    # Generate with: age-keygen -o secrets/keys/local.key
    # Then copy the public key from the output

  # Default rule for any other .enc files
  - path_regex: .*\.enc$
    age: >-
      age1remotelab0000000000000000000000000000000000000000000000000000

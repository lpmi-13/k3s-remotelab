apiVersion: batch/v1
kind: Job
metadata:
  name: django-migrate-{{ .Values.image.tag | replace "." "-" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "django-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    # Run migrations after database init but before main deployment
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "django-app.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      restartPolicy: OnFailure
      initContainers:
      - name: wait-for-db
        image: postgres:15
        env:
        - name: PGHOST
          value: {{ .Values.env.DATABASE_HOST | quote }}
        - name: PGPORT
          value: {{ .Values.env.DATABASE_PORT | quote }}
        - name: PGDATABASE
          value: {{ .Values.env.DATABASE_NAME | quote }}
        - name: PGUSER
          value: {{ .Values.env.DATABASE_USER | quote }}
        - name: PGPASSWORD
          value: {{ .Values.env.DATABASE_PASSWORD | quote }}
        command:
        - /bin/bash
        - -c
        - |
          set -e
          echo "=== Migration Job: Waiting for Database ==="
          echo "Database: $PGDATABASE at $PGHOST:$PGPORT"

          max_attempts=30
          attempt=1

          while [ $attempt -le $max_attempts ]; do
            if pg_isready -h "$PGHOST" -p "$PGPORT" -d "$PGDATABASE" -U "$PGUSER" -t 5 > /dev/null 2>&1; then
              if psql -c "SELECT 1" > /dev/null 2>&1; then
                echo "✓ Database is ready for migrations"
                exit 0
              fi
            fi

            if [ $attempt -lt $max_attempts ]; then
              sleep 2
            fi
            attempt=$((attempt + 1))
          done

          echo "✗ ERROR: Database not ready for migrations"
          exit 1
      containers:
      - name: migrate
        image: {{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env:
        {{- range $key, $value := .Values.env }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        command:
        - /bin/bash
        - -c
        - |
          set -e
          echo "=== Django Database Migrations ==="
          echo "Image: {{ .Values.image.repository }}:{{ .Values.image.tag }}"
          echo "Database: $DATABASE_NAME at $DATABASE_HOST:$DATABASE_PORT"
          echo ""

          # Show current migration status
          echo "Current migration status:"
          python manage.py showmigrations || true
          echo ""

          # Run migrations
          echo "Running migrations..."
          python manage.py migrate --noinput

          # Show final status
          echo ""
          echo "✓ Migrations completed successfully"
          echo ""
          echo "Final migration status:"
          python manage.py showmigrations

apiVersion: apps/v1
kind: Deployment
metadata:
  name: django
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "django-app.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "django-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "django-app.selectorLabels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.metrics.port | quote }}
        prometheus.io/path: {{ .Values.metrics.path | quote }}
    spec:
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      initContainers:
      - name: wait-for-db
        image: postgres:15
        env:
        - name: PGHOST
          value: {{ .Values.env.DATABASE_HOST | quote }}
        - name: PGPORT
          value: {{ .Values.env.DATABASE_PORT | quote }}
        - name: PGDATABASE
          value: {{ .Values.env.DATABASE_NAME | quote }}
        - name: PGUSER
          value: {{ .Values.env.DATABASE_USER | quote }}
        - name: PGPASSWORD
          value: {{ .Values.env.DATABASE_PASSWORD | quote }}
        command:
        - /bin/bash
        - -c
        - |
          set -e
          echo "=== Waiting for Database ==="
          echo "Host: $PGHOST:$PGPORT"
          echo "Database: $PGDATABASE"
          echo "User: $PGUSER"
          echo ""

          max_attempts=30
          attempt=1

          while [ $attempt -le $max_attempts ]; do
            echo "Attempt $attempt/$max_attempts: Checking database connectivity..."

            if pg_isready -h "$PGHOST" -p "$PGPORT" -d "$PGDATABASE" -U "$PGUSER" -t 5 > /dev/null 2>&1; then
              echo "✓ Database is ready"

              # Verify we can actually connect
              if psql -c "SELECT 1" > /dev/null 2>&1; then
                echo "✓ Successfully connected to database"
                echo "Django can now start!"
                exit 0
              else
                echo "⚠ Database is ready but connection failed, retrying..."
              fi
            else
              echo "⚠ Database not ready yet..."
            fi

            if [ $attempt -lt $max_attempts ]; then
              sleep 2
            fi
            attempt=$((attempt + 1))
          done

          echo "✗ ERROR: Database did not become ready after $max_attempts attempts"
          echo "Database: $PGDATABASE at $PGHOST:$PGPORT"
          exit 1
      containers:
      - name: django
        image: {{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env:
        {{- range $key, $value := .Values.env }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        ports:
        - containerPort: {{ .Values.service.port }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        readinessProbe:
          httpGet:
            path: {{ .Values.healthCheck.path }}
            port: {{ .Values.service.port }}
          initialDelaySeconds: {{ .Values.healthCheck.readinessInitialDelay }}
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: {{ .Values.healthCheck.path }}
            port: {{ .Values.service.port }}
          initialDelaySeconds: {{ .Values.healthCheck.livenessInitialDelay }}
          periodSeconds: 30
        {{- if .Values.persistence.enabled }}
        volumeMounts:
        - name: django-storage
          mountPath: /app/data
        {{- end }}
      {{- if .Values.persistence.enabled }}
      volumes:
      - name: django-storage
        persistentVolumeClaim:
          claimName: django-pvc
      {{- end }}

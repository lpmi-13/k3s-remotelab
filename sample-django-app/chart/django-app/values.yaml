image:
  registry: localhost:30300  # Gitea registry via NodePort (accessible from k3s node)
  repository: remotelab/django-app
  tag: latest
  pullPolicy: Always

imagePullSecrets:
  - name: gitea-registry-secret

service:
  type: ClusterIP
  port: 8000

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

env:
  REDIS_URL: "redis://redis:6379/1"
  DEBUG: "false"
  SECRET_KEY: "django-insecure-remotelab-key-change-in-production"
  FORCE_SCRIPT_NAME: "/django"
  # Database configuration
  DATABASE_ENGINE: "postgresql"
  DB_HOST: "postgresql"
  DB_PORT: "5432"
  DB_NAME: "remotelab"
  DB_USER: "remotelab"
  DB_PASSWORD: "remotelab"
  # Celery configuration
  CELERY_BROKER_URL: "redis://redis:6379/0"
  CELERY_RESULT_BACKEND: "redis://redis:6379/0"
  # OpenTelemetry tracing
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo.monitoring.svc.cluster.local:4317"
  OTEL_SERVICE_NAME: "django-app"

persistence:
  enabled: true
  size: 2Gi
  storageClass: local-path

healthCheck:
  path: /api/health/
  readinessInitialDelay: 30
  livenessInitialDelay: 60

metrics:
  enabled: true
  port: "8000"
  path: "/metrics"

# Celery worker configuration
celery:
  enabled: true
  replicas: 1
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

# Celery beat scheduler (single replica only)
celeryBeat:
  enabled: true
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi

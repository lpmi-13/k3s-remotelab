# Local environment values for django-app
# Environment-specific non-sensitive configuration

# Local environment might use smaller resources
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

# Enable all features for local testing
celery:
  enabled: true
  replicas: 1

celeryBeat:
  enabled: true

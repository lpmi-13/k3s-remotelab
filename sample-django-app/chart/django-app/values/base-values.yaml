# Base values for django-app
# Common non-sensitive configuration shared across all environments

image:
  registry: localhost:30300
  repository: remotelab/django-app
  pullPolicy: Always

imagePullSecrets:
  - name: gitea-registry-secret

service:
  type: ClusterIP
  port: 8000

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

persistence:
  enabled: true
  size: 2Gi
  storageClass: local-path

healthCheck:
  path: /api/health/
  readinessInitialDelay: 30
  livenessInitialDelay: 60

metrics:
  enabled: true
  port: "8000"
  path: "/metrics"

# Celery worker configuration
celery:
  enabled: true
  replicas: 1
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

# Celery beat scheduler (only one replica)
celeryBeat:
  enabled: true
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi


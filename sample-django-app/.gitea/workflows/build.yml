name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

env:
  REGISTRY: gitea:3000
  IMAGE_NAME: django-app

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Debug environment
        run: |
          echo "=== Database Configuration ==="
          python -c "import os; print(f'DATABASE_ENGINE={os.environ.get(\"DATABASE_ENGINE\", \"NOT SET\")}')"
          python -c "import os; print(f'DB_HOST={os.environ.get(\"DB_HOST\", \"NOT SET\")}')"

      - name: Run tests
        env:
          # Disable subpath routing for tests
          FORCE_SCRIPT_NAME: ''
          # Force SQLite database for tests
          DATABASE_ENGINE: 'sqlite'
          # Explicitly unset PostgreSQL environment variables
          DB_HOST: ''
          DB_USER: ''
          DB_PASSWORD: ''
          DB_NAME: ''
          DB_PORT: ''
          # Unset Redis/Celery for test isolation
          REDIS_URL: ''
          CELERY_BROKER_URL: ''
          CELERY_RESULT_BACKEND: ''
        run: |
          python manage.py test

      - name: Check code style
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  e2e-test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run e2e tests
        env:
          FORCE_SCRIPT_NAME: ''
          DATABASE_ENGINE: 'sqlite'
          SECRET_KEY: 'ci-test-secret-key'
          REDIS_URL: 'redis://localhost:6379/1'
          DB_HOST: ''
          DB_USER: ''
          DB_PASSWORD: ''
          DB_NAME: ''
          DB_PORT: ''
          CELERY_BROKER_URL: ''
          CELERY_RESULT_BACKEND: ''
        run: |
          python manage.py test remotelab.api.e2e_tests --verbosity=2

  build-and-push:
    needs: [test, e2e-test]
    runs-on: ubuntu-latest
    if: gitea.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          # Extract base version from version.py
          BASE_VERSION=$(grep "BASE_VERSION = " version.py | cut -d'"' -f2)
          # Create semantic version using build number
          SEMVER="${BASE_VERSION}.${{ gitea.run_number }}"
          echo "semver=${SEMVER}" >> $GITHUB_OUTPUT
          echo "base_version=${BASE_VERSION}" >> $GITHUB_OUTPUT
          echo "Tagging version: ${SEMVER}"

      - name: Configure Docker credentials
        run: |
          # Create docker config directly to bypass token auth flow
          # Using remotelab user credentials (lab environment)
          mkdir -p ~/.docker
          AUTH=$(echo -n "remotelab:remotelab" | base64 -w 0)
          cat > ~/.docker/config.json << EOF
          {
            "auths": {
              "${{ env.REGISTRY }}": {
                "auth": "${AUTH}"
              }
            }
          }
          EOF
          echo "Docker credentials configured for ${{ env.REGISTRY }}"

      - name: Extract metadata
        id: meta
        run: |
          GITEA_IMAGE="${{ env.REGISTRY }}/${{ gitea.repository_owner }}/${{ env.IMAGE_NAME }}"
          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          echo "image=${GITEA_IMAGE}" >> $GITHUB_OUTPUT
          echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build \
            --build-arg APP_VERSION=${{ steps.version.outputs.semver }} \
            --build-arg BUILD_COMMIT=${{ gitea.sha }} \
            --build-arg BUILD_DATE=${{ steps.meta.outputs.build_date }} \
            -t ${{ steps.meta.outputs.image }}:${{ steps.version.outputs.semver }} \
            -t ${{ steps.meta.outputs.image }}:latest \
            .

      - name: Push to registry
        run: |
          # Install skopeo (handles auth without token flow issues)
          apt-get update -qq && apt-get install -y -qq skopeo > /dev/null
          # Push images using skopeo with explicit credentials (lab environment)
          skopeo copy --dest-tls-verify=false \
            --dest-creds="remotelab:remotelab" \
            docker-daemon:${{ steps.meta.outputs.image }}:${{ steps.version.outputs.semver }} \
            docker://${{ steps.meta.outputs.image }}:${{ steps.version.outputs.semver }}
          skopeo copy --dest-tls-verify=false \
            --dest-creds="remotelab:remotelab" \
            docker-daemon:${{ steps.meta.outputs.image }}:latest \
            docker://${{ steps.meta.outputs.image }}:latest
          echo "Images pushed successfully"

  package-and-push-helm:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: gitea.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          # Extract base version from version.py
          BASE_VERSION=$(grep "BASE_VERSION = " version.py | cut -d'"' -f2)
          # Create semantic version using build number
          SEMVER="${BASE_VERSION}.${{ gitea.run_number }}"
          echo "semver=${SEMVER}" >> $GITHUB_OUTPUT
          echo "base_version=${BASE_VERSION}" >> $GITHUB_OUTPUT
          echo "Helm chart version: 0.1.${{ gitea.run_number }}"
          echo "App version: ${SEMVER}"

      - name: Install Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Update Chart metadata
        run: |
          cd chart/django-app
          # Update Chart.yaml version and appVersion
          sed -i "s/^version:.*/version: 0.1.${{ gitea.run_number }}/" Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${{ steps.version.outputs.semver }}\"/" Chart.yaml
          # Update values.yaml image tag and registry
          sed -i "s/tag: .*/tag: ${{ steps.version.outputs.semver }}/" values.yaml
          # Update registry to use NodePort (accessible from k3s node for image pulls)
          sed -i "s|registry:.*|registry: localhost:30300  # Gitea registry via NodePort|" values.yaml
          echo "Updated Chart.yaml and values.yaml:"
          cat Chart.yaml
          echo "---"
          cat values.yaml

      - name: Package Helm chart
        run: |
          cd chart
          helm package django-app
          echo "Packaged charts:"
          ls -la *.tgz

      - name: Push Helm chart to Gitea package registry
        run: |
          cd chart
          # Use curl to push directly to Gitea's package API (bypasses OCI auth issues)
          CHART_FILE="django-app-0.1.${{ gitea.run_number }}.tgz"
          curl -X POST \
            -u "remotelab:remotelab" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@${CHART_FILE}" \
            "http://${{ env.REGISTRY }}/api/packages/remotelab/helm/api/charts" \
            && echo "Helm chart pushed to Gitea package registry"
kind: playground
name: argo-remotelab-3bf4e8fb
base: flexbox
title: Argo RemoteLab
description: Diagnose ArgoCD and SOPS GitOps failures in a preloaded k3s VM.
categories:
  - kubernetes
  - ci-cd
playground:
  networks:
    - name: local
      subnet: 172.16.0.0/24
  machines:
    - name: cplane-01
      users:
        - name: root
        - name: laborant
          default: true
          welcome: |
            This lab opens after the first GitOps failure has already been injected and detected by ArgoCD.

            Click the icon to open the argocd web UI in a new tab (it's the box with the arrow in the argcd tab).

            Public tabs:
            - argocd

            Credentials:
            - ArgoCD: admin / remotelab

            Useful local endpoints from the terminal:
            - ArgoCD: http://127.0.0.1:30080
            - Gitea:  http://127.0.0.1:30082

            Clone the lab repo to fix scenarios that need a git push:
              git clone http://remotelab:remotelab@127.0.0.1:30082/remotelab/django-app.git
      drives:
        - source: oci://ghcr.io/lpmi-13/argo-remotelab-k3s-rootfs:v6
          mount: /
          size: 30GiB
      network:
        interfaces:
          - address: 172.16.0.2/24
            network: local
      resources:
        cpuCount: 4
        ramSize: 8GiB
  tabs:
    - id: terminal-cplane-01
      kind: terminal
      name: cplane-01
      machine: cplane-01
    - id: http-port-argocd
      kind: http-port
      name: argocd
      machine: cplane-01
      number: 30080
      access: public
  initTasks:
    init_cplane_01_1:
      name: init_cplane_01_1
      machine: cplane-01
      init: true
      user: root
      timeout_seconds: 900
      run: |-
        #!/bin/bash
        set -euo pipefail

        FIRST_SCENARIO_TIMEOUT_SECONDS=840 /opt/argo-remotelab/scripts/wait-first-scenario-ready.sh
  accessControl:
    canList:
      - owner
    canRead:
      - owner
    canStart:
      - owner

# Job to initialize the remotelab database for Django
# This creates the database and user if they don't exist
apiVersion: batch/v1
kind: Job
metadata:
  name: django-db-init
  namespace: applications
  annotations:
    # ArgoCD hook to run before syncing the Django app
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: db-init
        image: postgres:15
        env:
        - name: PGHOST
          value: "postgresql"
        - name: PGPORT
          value: "5432"
        - name: PGUSER
          value: "gitea"
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: postgresql-secret
              key: password
        - name: PGCONNECT_TIMEOUT
          value: "5"
        command:
        - /bin/bash
        - -c
        - |
          set -e

          echo "=== Django Database Initialization Job ==="
          echo "Host: $PGHOST:$PGPORT"
          echo "Admin User: $PGUSER"
          echo "Target Database: remotelab"
          echo "Target User: remotelab"
          echo ""

          # Function to wait for PostgreSQL to be ready
          wait_for_postgres() {
            echo "Waiting for PostgreSQL to be ready..."
            local max_attempts=30
            local attempt=1

            while [ $attempt -le $max_attempts ]; do
              echo "Attempt $attempt/$max_attempts: Connecting to PostgreSQL..."

              if pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -t 5 > /dev/null 2>&1; then
                echo "✓ PostgreSQL is ready!"

                # Double-check we can actually connect and run a query
                if psql -c "SELECT 1" postgres > /dev/null 2>&1; then
                  echo "✓ Successfully executed test query"
                  return 0
                else
                  echo "⚠ PostgreSQL is ready but query failed, retrying..."
                fi
              else
                echo "⚠ PostgreSQL not ready yet..."
              fi

              if [ $attempt -lt $max_attempts ]; then
                sleep 2
              fi
              attempt=$((attempt + 1))
            done

            echo "✗ ERROR: PostgreSQL did not become ready after $max_attempts attempts"
            return 1
          }

          # Wait for PostgreSQL to be ready
          if ! wait_for_postgres; then
            echo "✗ FATAL: Cannot connect to PostgreSQL at $PGHOST:$PGPORT"
            echo "Please check that PostgreSQL is running and accessible"
            exit 1
          fi

          echo ""
          echo "=== Checking Database and User ==="

          # Check if user exists
          USER_EXISTS=$(psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='remotelab'" postgres || echo "0")

          if [ "$USER_EXISTS" = "1" ]; then
            echo "✓ User 'remotelab' already exists"
          else
            echo "Creating user 'remotelab'..."
            psql -c "CREATE USER remotelab WITH PASSWORD 'remotelab';" postgres

            # Verify user was created
            USER_EXISTS=$(psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='remotelab'" postgres || echo "0")
            if [ "$USER_EXISTS" = "1" ]; then
              echo "✓ User 'remotelab' created successfully"
            else
              echo "✗ ERROR: Failed to create user 'remotelab'"
              exit 1
            fi
          fi

          # Check if database exists
          DB_EXISTS=$(psql -tAc "SELECT 1 FROM pg_database WHERE datname='remotelab'" postgres || echo "0")

          if [ "$DB_EXISTS" = "1" ]; then
            echo "✓ Database 'remotelab' already exists"
          else
            echo "Creating database 'remotelab'..."
            psql -c "CREATE DATABASE remotelab OWNER remotelab;" postgres

            # Verify database was created
            DB_EXISTS=$(psql -tAc "SELECT 1 FROM pg_database WHERE datname='remotelab'" postgres || echo "0")
            if [ "$DB_EXISTS" = "1" ]; then
              echo "✓ Database 'remotelab' created successfully"
            else
              echo "✗ ERROR: Failed to create database 'remotelab'"
              exit 1
            fi
          fi

          # Grant privileges (idempotent operation)
          echo "Granting privileges..."
          psql -c "GRANT ALL PRIVILEGES ON DATABASE remotelab TO remotelab;" postgres
          echo "✓ Privileges granted"

          # Test connection as remotelab user
          echo ""
          echo "=== Testing Connection as 'remotelab' User ==="
          if PGUSER=remotelab PGPASSWORD=remotelab psql -h "$PGHOST" -d remotelab -c "SELECT 1" > /dev/null 2>&1; then
            echo "✓ Successfully connected to 'remotelab' database as 'remotelab' user"
          else
            echo "✗ ERROR: Cannot connect to 'remotelab' database as 'remotelab' user"
            echo "This will cause Django to fail!"
            exit 1
          fi

          echo ""
          echo "=== Database Initialization Complete ==="
          echo "✓ User 'remotelab' is ready"
          echo "✓ Database 'remotelab' is ready"
          echo "✓ Connection test passed"
          echo "Django can now connect to the database"
---
# Secret for Django database credentials
apiVersion: v1
kind: Secret
metadata:
  name: django-db-secret
  namespace: applications
type: Opaque
stringData:
  DB_USER: "remotelab"
  DB_PASSWORD: "remotelab"
  DB_NAME: "remotelab"

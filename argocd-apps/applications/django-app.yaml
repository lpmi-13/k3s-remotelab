apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: django-api
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  # Multi-source configuration for layered values
  sources:
  # Source 1: Helm chart from Gitea package registry
  - repoURL: http://gitea.applications.svc.cluster.local:3000/api/packages/remotelab/helm
    chart: django-app
    targetRevision: "*"
    helm:
      # Reference values from the Git source below
      valueFiles:
      - $values/sample-django-app/chart/django-app/values/base-values.yaml
      - $values/sample-django-app/chart/django-app/values/local-values.yaml
      - $values/sample-django-app/chart/django-app/values/image-tag.yaml
      # Note: For SOPS-encrypted secrets, use:
      # - secrets+age-import:///sops-age-key/key.txt?$values/sample-django-app/chart/django-app/values/local-secrets.yaml.enc

  # Source 2: Values files from Git repository
  - repoURL: http://gitea.applications.svc.cluster.local:3000/remotelab/manifests.git
    targetRevision: HEAD
    ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: applications

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true

  ignoreDifferences:
  - group: apps
    kind: Deployment
    jsonPointers:
    - /spec/replicas

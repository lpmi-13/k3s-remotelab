apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: django-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  # Single source: Helm chart from git repository
  source:
    repoURL: http://gitea.applications.svc.cluster.local:3000/remotelab/django-app.git
    targetRevision: main
    path: chart/django-app
    helm:
      valueFiles:
      - values.yaml
      # SOPS-encrypted secrets decrypted by helm-secrets plugin
      - secrets+age-import:///sops-age-key/key.txt?secrets.yaml.enc

  destination:
    server: https://kubernetes.default.svc
    namespace: applications

  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
    - CreateNamespace=true

  ignoreDifferences:
  - group: apps
    kind: Deployment
    jsonPointers:
    - /spec/replicas
